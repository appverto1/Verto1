    <link rel="shortcut icon" href="/branding/verto/favicon.ico?v=20260818-1" />

  <body>
    <div id="root">
      <!-- Static first paint. React replaces this on its first commit.
           Presentation only: no portal, clinic, user or session data. -->
      <div class="verto-boot" role="status" aria-label="Carregando Verto" aria-busy="true">
        <header class="verto-boot-header">
          <span class="verto-boot-logo" aria-hidden="true">verto</span>
          <span class="verto-boot-pill" aria-hidden="true"></span>
        </header>
        <main class="verto-boot-hero" aria-hidden="true">
          <div class="verto-boot-copy">
            <div class="verto-boot-chip"></div>
            <div class="verto-boot-line verto-boot-title"></div>
            <div class="verto-boot-line verto-boot-title-short"></div>
            <div class="verto-boot-line verto-boot-paragraph"></div>
            <div class="verto-boot-line verto-boot-paragraph-short"></div>
            <div class="verto-boot-card"></div>
          </div>
          <div class="verto-boot-preview">
            <div class="verto-boot-preview-bar"></div>
            <div class="verto-boot-preview-body"></div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
