name: One-time P0 ABA V3 exposure route patch
on:
  push:
    branches:
      - fix/p0-08-tutorial-26-28-20261008
    paths:
      - .github/workflows/p0-aba-v3-exposure-once.yml
permissions:
  contents: write
jobs:
  apply-reviewed-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-08-tutorial-26-28-20261008
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply narrow, fail-closed server.ts patch
        run: node scripts/p0-aba-v3-exposure-once.mjs
      - name: Verify only the expected oversized file changed and commit
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "server.ts"
          git add server.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "fix(p0-8): mount authorized no-opportunity endpoint into server"
          git fetch origin fix/p0-08-tutorial-26-28-20261008
          git rebase origin/fix/p0-08-tutorial-26-28-20261008
          git push origin HEAD:fix/p0-08-tutorial-26-28-20261008
