name: Verto one-shot canonical Stripe extraction from server.ts

on:
  push:
    branches:
      - refactor/critical-09-canonical-stripe-webhook-20261106
    paths:
      - .github/workflows/critical-09-canonical-oneshot-extraction.yml

permissions:
  contents: write

jobs:
  extract-once:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Refuse drift; extract Stripe handler byte-identically
        run: python3 scripts/critical-09-canonical-oneshot-extraction.py
      - name: Verify exact changed files and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          diff -u <(printf '%s\n' 'scripts/pre-main-gate.mjs' 'server.ts') <(git diff --name-only | sort)
          test -f services/stripeCanonicalWebhookRoute.ts
      - name: Commit only audited files; remove one-shot automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts services/stripeCanonicalWebhookRoute.ts scripts/pre-main-gate.mjs
          git rm scripts/critical-09-canonical-oneshot-extraction.py .github/workflows/critical-09-canonical-oneshot-extraction.yml
          git diff --cached --check
          git commit -m 'refactor(staging): extrair webhook Stripe principal do server.ts (item 09)'
          git push origin HEAD:refactor/critical-09-canonical-stripe-webhook-20261106
