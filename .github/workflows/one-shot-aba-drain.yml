name: One Time ABA V3 Drain Status Extraction
on:
  push:
    branches:
      - refactor/staging-aba-v3-drain-status-current-20261023
    paths:
      - .github/workflows/one-shot-aba-drain.yml
permissions:
  contents: write
jobs:
  apply:
    if: "github.event.head_commit.message == 'chore(aba): execute bounded one-time handler extraction'"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract verified identical handler and delete temporary executor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'refactor/staging-aba-v3-drain-status-current-20261023'
          python3 scripts/one-shot-aba-v3-drain.py
          git diff --check
          git rm -- scripts/one-shot-aba-v3-drain.py .github/workflows/one-shot-aba-drain.yml
          git add -- server.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(aba): extract unchanged admin drain status handler'
          git push origin 'HEAD:refactor/staging-aba-v3-drain-status-current-20261023'
