name: Materialize P0 Clinical Graph Scope

on:
  push:
    branches:
      - 'fix/p0-clinical-graph-role-scope-20261007'

permissions:
  contents: write

concurrency:
  group: p0-clinical-graph-scope-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[graph-scope-materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/p0-clinical-graph-role-scope-20261007

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Materialize exact server patch
        run: node scripts/materialize-p0-clinical-graph-scope.mjs

      - name: Commit materialized product change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- server.ts; then
            echo "No server change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "fix(p0): materialize clinical graph specialty scope [graph-scope-materialized]"
          git push origin HEAD:fix/p0-clinical-graph-role-scope-20261007
