name: Server Entry Point Slice Writer (isolated feature branch)
on:
  push:
    branches:
      - refactor/backend-server-entrypoint-slice-20261011
permissions:
  contents: write
jobs:
  extract:
    if: github.event.head_commit.message == 'chore(backend): authorize isolated ready-route extraction'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Extract exact readiness handler
        run: node scripts/server-entrypoint-slice-apply.mjs
      - name: Verify behavior and build before any commit
        run: |
          node --import tsx tests/serverReadyRouteHandler.test.ts
          node tests/serverReadyRouteExtraction.regression.test.mjs
          npm run build
          git diff --check
      - name: Commit exclusively to isolated feature branch
        env:
          TARGET_BRANCH: refactor/backend-server-entrypoint-slice-20261011
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server.ts services/readyRouteHandler.ts docs/backend-modularization/20261011-server-entrypoint-slice.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "refactor(backend): extract ready handler directly from server.ts"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
