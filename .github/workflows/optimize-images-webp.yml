name: One-time WebP image derivatives (feature branch only)

on:
  push:
    branches:
      - perf/02-webp-images-20261119
    paths:
      - '.github/workflows/optimize-images-webp.yml'
      - 'scripts/optimize-static-images.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verto-webp-derivatives-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/perf/02-webp-images-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image conversion tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate and inspect WebP files
        run: python scripts/optimize-static-images.py
      - name: Commit optimized assets to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public services/help-media scripts/image-webp-report.json
          if git diff --cached --quiet; then
            echo "Optimized assets unchanged"
          else
            git commit -m "perf(images): add responsive WebP assets, retain PNG/JPEG originals"
            git push origin HEAD:refs/heads/perf/02-webp-images-20261119
          fi
