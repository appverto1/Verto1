name: Main paid Director Google activation PKCE regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/supabase.ts'
      - 'src/lib/implicitOAuthLogin.ts'
      - 'src/App.tsx'
      - 'src/components/LandingPage.tsx'
      - 'src/services/salesActivationGoogleOAuth.ts'
      - 'src/components/SalesActivationAccess.tsx'
      - 'tests/salesDirectorGoogleFirstAccessTask12.regression.test.mjs'
      - 'tests/googleOauthActivationUi.regression.test.mjs'
      - 'tests/mainPublicLandingEntry.regression.test.mjs'
      - 'tests/googleOAuthPasswordFlash.regression.test.mjs'
      - 'tests/implicitGoogleOAuthLogin.regression.test.ts'
      - '.github/workflows/main-paid-director-google-activation.yml'
permissions:
  contents: read
concurrency:
  group: main-paid-director-google-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paid-director-google-gate:
    name: paid-director-google-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Paid Director Google activation identity, PKCE and callback regression
        run: |
          node --test tests/salesDirectorGoogleFirstAccessTask12.regression.test.mjs
          node tests/googleOauthActivationUi.regression.test.mjs
          node --test tests/mainPublicLandingEntry.regression.test.mjs
          node tests/authStateChangeDeadlockRegression.test.mjs
          node tests/googleOAuthPasswordFlash.regression.test.mjs
          node --import tsx tests/implicitGoogleOAuthLogin.regression.test.ts
      - name: Reject new TypeScript diagnostics versus production main
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/verto-main-typebase origin/main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/verto-main-typebase/node_modules
          echo 0 > /tmp/base-ts-exit
          echo 0 > /tmp/candidate-ts-exit
          (cd /tmp/verto-main-typebase && "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --pretty false) > /tmp/base-tsc.log 2>&1 || echo $? > /tmp/base-ts-exit
          ./node_modules/.bin/tsc --noEmit --pretty false > /tmp/candidate-tsc.log 2>&1 || echo $? > /tmp/candidate-ts-exit
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { parseTypeScriptDiagnostics, findNewTypeScriptDiagnostics } from './scripts/typecheck-ratchet.mjs';
          const baseline = readFileSync('/tmp/base-tsc.log', 'utf8');
          const candidate = readFileSync('/tmp/candidate-tsc.log', 'utf8');
          const baselineExit = Number(readFileSync('/tmp/base-ts-exit', 'utf8').trim());
          const candidateExit = Number(readFileSync('/tmp/candidate-ts-exit', 'utf8').trim());
          const b = parseTypeScriptDiagnostics(baseline);
          const c = parseTypeScriptDiagnostics(candidate);
          if ((baselineExit !== 0 && b.length === 0) || (candidateExit !== 0 && c.length === 0)) {
            throw new Error('Typecheck ended unexpectedly without parseable TypeScript diagnostics');
          }
          const added = c.length === 0 ? [] : b.length === 0 ? c : findNewTypeScriptDiagnostics(candidate, baseline);
          if (added.length) {
            console.error('New TypeScript diagnostics compared with main:', added.map(d => d.original).join('\n'));
            process.exitCode = 1;
          } else {
            console.log('TypeScript differential PASS; baseline diagnostics:', b.length, 'candidate:', c.length, 'new:', added.length);
          }
          NODE
      - name: Runtime imports
        run: npm run check:docker-runtime-imports
      - name: Production UI build
        run: npm run build
