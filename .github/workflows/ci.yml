name: Verto Strict CI

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: verto-strict-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-quality:
    name: strict-quality
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Use Node 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies deterministically
        id: install
        run: npm ci

      - name: Typecheck
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint contract
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Production build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Full test suite
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Pre-main gate
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run check:pre-main

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install verified Gitleaks 8.24.3
        shell: bash
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_ARCHIVE: gitleaks_8.24.3_linux_x64.tar.gz
          GITLEAKS_ARCHIVE_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/$GITLEAKS_ARCHIVE"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$bin_dir"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}" \
            --output "$archive_path"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive_path}" | sha256sum --check --strict
          tar -xzf "$archive_path" -C "$bin_dir" gitleaks
          chmod 0755 "$bin_dir/gitleaks"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Secret scan — candidate tree only, fully redacted
        shell: bash
        run: |
          set -euo pipefail
          gitleaks version
          gitleaks dir --redact=100 --no-banner --exit-code 1 .
