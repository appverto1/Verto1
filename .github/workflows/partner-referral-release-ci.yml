name: Partner referral promotion gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/publicSalesLeadInput.ts'
      - 'services/publicSalesLeadRoutes.ts'
      - 'supabase/migrations/20261110160000_verto_partnerships_foundation_v1.sql'
      - 'supabase/migrations/20261111154000_verto_partner_referral_coupon_v1.sql'
      - 'supabase/migrations/20261111190000_verto_partner_coupon_compact_format_v1.sql'
      - 'supabase/migrations/20261111203000_verto_partner_referral_crm_reporting_v1.sql'
      - 'tests/publicSalesLeadInput.behavior.test.ts'
      - 'tests/publicSalesLeadRouteBehavior.test.ts'
      - 'tests/partnerReferralLeadPromotion.test.ts'
      - '.github/workflows/partner-referral-release-ci.yml'
      - 'server.ts'
      - 'src/App.tsx'
      - 'src/components/LandingPage.tsx'
      - 'src/components/SuperAdminDashboard.tsx'
      - 'src/components/TherapistDashboard.tsx'
      - 'src/components/SalesInterestForm.tsx'
      - 'src/components/PartnershipPanel.tsx'
      - 'src/components/ExternalPartnershipPortal.tsx'
      - 'src/components/PartnerMarketplace*.tsx'
      - 'services/partnerships/**'
      - 'src/lib/partnerEmailCallback.ts'
      - 'src/utils/sensitiveApiMutationProtection.mjs'
      - 'supabase/migrations/*partner*'
      - 'tests/partner*'
      - 'tests/partnership*'
      - 'docs/releases/20261116-partnerships-full-production-reconciliation.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partner-referral-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-lead-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test existing lead and new optional referral
        run: npx --no-install tsx --test tests/publicSalesLeadInput.behavior.test.ts tests/publicSalesLeadRouteBehavior.test.ts tests/partnerReferralLeadPromotion.test.ts
      - name: Partner signup, authorization, coupons, marketplace and tier regressions
        run: |
          node --import tsx tests/partnershipSecurity.test.ts
          node --import tsx tests/partnerReferralCoupon.test.ts
          node --import tsx tests/partnerApprovalFlow.test.ts
          node --import tsx tests/partnershipEmailCallback.test.ts
          node --import tsx tests/partnerMarketplaceSecurity.test.ts
          node --import tsx tests/partnerMarketplaceImageUpload.test.ts
          node tests/partnerTieredCommission.regression.test.mjs
          node tests/partnerTierBrand.regression.test.mjs
          node --import tsx tests/partnerPortalTabs.test.ts
          node --import tsx tests/partnerMarketplaceReviewLimit.test.ts
          node --import tsx tests/partnerMarketplaceFiveReviewsSchema.test.ts
          node tests/partnershipRouteMount.regression.test.mjs
          node tests/partnerMainIntegration.regression.test.mjs
      - name: Check production frontend build compatibility
        run: npm run build
