name: Apply targeted specialist plan patch (temporary)
on:
  push:
    branches:
      - fix/staging-specialist-plan-session-activation-20261022
    paths:
      - .github/workflows/specialist-plan-onetime-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Exact-anchor server patch
        run: |
          node scripts/apply-specialist-session-activation-patch.mjs
          git diff --check
          test "$(git diff --name-only)" = "server.ts"
          git config user.name "verto-staging-ci"
          git config user.email "verto-staging-ci@users.noreply.github.com"
          git add server.ts
          git commit -m "fix(therapeutic): self-authored specialty plans activate without admin approval"
          git push origin HEAD:refs/heads/fix/staging-specialist-plan-session-activation-20261022
