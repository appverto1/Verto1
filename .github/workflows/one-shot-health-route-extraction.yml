name: One-shot scoped health route extraction
on:
  push:
    branches:
      - refactor/backend-health-route-20261011
permissions:
  contents: write
concurrency:
  group: verto-health-route-one-shot
  cancel-in-progress: false
jobs:
  scoped-extraction:
    if: github.ref == 'refs/heads/refactor/backend-health-route-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/one-shot-health-route-extraction.mjs
