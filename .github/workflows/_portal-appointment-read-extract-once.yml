name: One-time guarded portal appointment read extraction
on:
  push:
    branches:
      - refactor/backend-portal-appointments-read-batch-20261013
permissions:
  contents: write
jobs:
  extract:
    if: github.ref == 'refs/heads/refactor/backend-portal-appointments-read-batch-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Extract guarded exact source slice
        run: node scripts/_portal-appointment-read-extract-once.mjs
      - name: Read-only authorization, tenant and contract mock regressions
        run: node --import tsx tests/portalAppointmentReadHandlers.test.ts
      - name: Compile the isolated handler module
        run: npx tsc --noEmit --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --esModuleInterop services/portalAppointmentReadHandlers.ts
      - name: Build
        run: npm run build
      - name: Publish only final code tests and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_portal-appointment-read-extract-once.yml
          rm scripts/_portal-appointment-read-extract-once.mjs
          git diff --check
          git add -- server.ts services/portalAppointmentReadHandlers.ts tests/portalAppointmentReadHandlers.test.ts docs/backend-modularization/20261013-portal-appointment-read-manifest.json docs/backend-modularization/20261013-portal-appointment-read.md .github/workflows/_portal-appointment-read-extract-once.yml scripts/_portal-appointment-read-extract-once.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "refactor(backend): extract portal appointment read handlers"
          git push origin HEAD:refs/heads/refactor/backend-portal-appointments-read-batch-20261013
