name: Temporary scoped specialty plan patch
on:
  push:
    branches:
      - fix/individual-specialty-plan-therapist-permission-20261010
    paths:
      - .github/workflows/temporary-specialty-plan-patch.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'appverto1/Verto1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact scoped permission substitutions to server.ts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let source = fs.readFileSync('server.ts', 'utf8');
          const one = (a, b) => {
            const matches = source.split(a).length - 1;
            if (matches !== 1) throw Error('Server scope mismatch: ' + a.slice(0, 110) + ' (count ' + matches + ')');
            source = source.replace(a,b);
          };
          one(
            "      if (participantProfessionalIds.some((id) => !isUuid(id))) {",
            "      if (mode === 'interdisciplinary' && String(req.effectiveClinicRole || '').toLowerCase() === 'therapist') {\n        return res.status(403).json({ success: false, error: 'THERAPEUTIC_PLAN_INTERDISCIPLINARY_MANAGEMENT_REQUIRED' });\n      }\n      if (participantProfessionalIds.some((id) => !isUuid(id))) {"
          );
          const replacements = [
            ["app.patch('/api/aba/patients/:patientId/therapeutic-plans/:planId', checkAuth, requireClinicCapability('treatment_plan.edit'), checkPatientAccess",
             "app.patch('/api/aba/patients/:patientId/therapeutic-plans/:planId', checkAuth, requireAnyClinicCapability('treatment_plan.edit', 'treatment_plan.create'), checkPatientAccess"],
            ["app.post('/api/aba/patients/:patientId/therapeutic-programs', requireAbaV2Feature, checkAuth, requireClinicCapability('aba.program.create'), checkPatientAccess",
             "app.post('/api/aba/patients/:patientId/therapeutic-programs', requireAbaV2Feature, checkAuth, requireAnyClinicCapability('aba.program.create', 'treatment_plan.create'), checkPatientAccess"],
            ["app.patch('/api/aba/patients/:patientId/therapeutic-programs/:programId/status', requireAbaV2Feature, checkAuth, requireClinicCapability('aba.program.edit'), checkPatientAccess",
             "app.patch('/api/aba/patients/:patientId/therapeutic-programs/:programId/status', requireAbaV2Feature, checkAuth, requireAnyClinicCapability('aba.program.edit', 'treatment_plan.create'), checkPatientAccess"],
            ["app.patch('/api/aba/patients/:patientId/therapeutic-programs/:programId', requireAbaV2Feature, checkAuth, requireClinicCapability('aba.program.edit'), checkPatientAccess",
             "app.patch('/api/aba/patients/:patientId/therapeutic-programs/:programId', requireAbaV2Feature, checkAuth, requireAnyClinicCapability('aba.program.edit', 'treatment_plan.create'), checkPatientAccess"],
            ["app.post('/api/aba/patients/:patientId/therapeutic-programs/:programId/targets', requireAbaV2Feature, checkAuth, requireClinicCapability('aba.program.edit'), checkPatientAccess",
             "app.post('/api/aba/patients/:patientId/therapeutic-programs/:programId/targets', requireAbaV2Feature, checkAuth, requireAnyClinicCapability('aba.program.edit', 'treatment_plan.create'), checkPatientAccess"]
          ];
          for (const [a,b] of replacements) one(a,b);
          fs.writeFileSync('server.ts', source, 'utf8');
          NODE
      - name: Commit scoped server changes
        shell: bash
        run: |
          git config user.name "verto-staging-bot"
          git config user.email "verto-staging-bot@users.noreply.github.com"
          git add -- server.ts
          git diff --cached --check
          git commit -m "fix(P0): enable therapist-owned specialty plan and program routes only"
          git push origin HEAD:fix/individual-specialty-plan-therapist-permission-20261010
