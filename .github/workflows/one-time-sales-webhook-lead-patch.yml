name: One-time Verto sales webhook lead guard patch
on:
  push:
    branches:
      - fix/critical-sellable-09-lead-webhook-filter-20261104
    paths:
      - .github/workflows/one-time-sales-webhook-lead-patch.yml

permissions:
  contents: write

jobs:
  apply-single-targeted-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch only the unpaid webhook lead update and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('server.ts')
          original=source.read_text()
          old='\n'.join([
            '        supabase',
            '          .from("sales_leads")',
            '          .update({ status: "payment_pending", updated_at: now })',
            '          .eq("id", leadId)',
            '          .is("deleted_at", null),',
          ])
          new='\n'.join([
            '        supabase',
            '          .from("sales_leads")',
            '          .update({ status: "payment_pending", updated_at: now })',
            '          .eq("id", leadId)',
            '          .is("deleted_at", null)',
            '          // Old unpaid webhook must not demote an already converted clinic.',
            '          .neq("status", "converted"),',
          ])
          assert original.count(old)==1, 'Refuse unexpected server.ts layout'
          updated=original.replace(old,new)
          assert updated.count(new)==1
          source.write_text(updated)
          Path('.github/workflows/one-time-sales-webhook-lead-patch.yml').unlink()
          PY
          git diff --check
          git diff --stat
          git diff -- server.ts | grep -F '.neq("status", "converted")'
          git add server.ts .github/workflows/one-time-sales-webhook-lead-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sales): prevent delayed unpaid webhook from demoting converted lead"
          git push origin HEAD:fix/critical-sellable-09-lead-webhook-filter-20261104
