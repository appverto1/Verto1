name: Apply commercial boleto production release

on:
  push:
    branches:
      - release/commercial-boleto-production-20261007
    paths:
      - 'release/**'
      - '.github/workflows/apply-commercial-boleto-release.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture production typecheck baseline
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck-baseline.log 2>&1
          echo $? > /tmp/typecheck-baseline.status
          set -e
          grep -E "error TS[0-9]+:" /tmp/typecheck-baseline.log | sort -u > /tmp/typecheck-baseline.errors || true
          echo "Baseline errors: $(wc -l < /tmp/typecheck-baseline.errors)"

      - name: Apply only approved boleto activation patches
        shell: bash
        run: |
          set -euo pipefail
          for patch in             release/01-boleto-async.patch             release/02-boleto-google.patch
          do
            echo "Checking $patch"
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Enforce release scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/changed-files.txt
          cat > /tmp/allowed-files.txt <<'EOF'
          server.ts
          src/App.tsx
          src/components/SalesActivationAccess.tsx
          tests/salesAutomaticDirectorPostPayment20260831.regression.test.mjs
          tests/salesBoletoAsyncActivationEmail20261005.regression.test.mjs
          tests/salesDirectorContractActivation20260831.regression.test.mjs
          tests/salesPaidDirectorActivationEmailRecovery20260831.regression.test.mjs
          EOF
          sort -o /tmp/allowed-files.txt /tmp/allowed-files.txt
          if ! diff -u /tmp/allowed-files.txt /tmp/changed-files.txt; then
            echo "::error::Release scope differs from the approved payment-link/boleto files."
            exit 1
          fi

      - name: Typecheck ratchet
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck-candidate.log 2>&1
          CANDIDATE_STATUS=$?
          set -e
          grep -E "error TS[0-9]+:" /tmp/typecheck-candidate.log | sort -u > /tmp/typecheck-candidate.errors || true
          comm -13 /tmp/typecheck-baseline.errors /tmp/typecheck-candidate.errors > /tmp/typecheck-new.errors || true
          if [ -s /tmp/typecheck-new.errors ]; then
            echo "::error::Payment-link release introduced new typecheck errors:"
            cat /tmp/typecheck-new.errors
            exit 1
          fi
          if [ "$CANDIDATE_STATUS" -ne 0 ]; then
            echo "::warning::Candidate contains only typecheck errors already present on production baseline."
          fi

      - name: Production build
        run: npm run build

      - name: Validate payment-link and activation regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/salesCheckoutLinkMonotonicLifecycle.test.mjs
          node tests/salesActivationExpiredLinkReissue.test.mjs
          node tests/salesAutomaticDirectorPostPayment20260831.regression.test.mjs
          node tests/salesBoletoAsyncActivationEmail20261005.regression.test.mjs
          node tests/salesDirectorContractActivation20260831.regression.test.mjs
          node tests/salesPaidDirectorActivationEmailRecovery20260831.regression.test.mjs
          node tests/googleOauthActivationUi.regression.test.mjs
          node tests/salesActivationPasswordProviderAgnostic.test.mjs
          npx tsx tests/salesActivationDirectorProvisioning.test.ts
          npx tsx tests/salesActivationEmailConcurrency.test.ts
          npm run check:pre-main

      - name: Commit validated release payload
        shell: bash
        run: |
          set -euo pipefail
          git rm -r release
          git rm .github/workflows/apply-commercial-boleto-release.yml
          git config user.name "Verto Release Bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add server.ts src tests
          git commit -m "release(prod): promote validated boleto payment-link flow"
          git push origin HEAD:release/commercial-boleto-production-20261007
