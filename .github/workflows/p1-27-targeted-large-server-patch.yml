name: P1-27 targeted route patch
on:
  push:
    branches:
      - fix/staging-p1-27-auto-cancel-from-24h-reminder-20261021
    paths:
      - scripts/patch-p1-27-portal-cancel-route.mjs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch one portal cancellation route
        run: |
          node scripts/patch-p1-27-portal-cancel-route.mjs
          git diff --check
          test "$(git diff --name-only)" = "server.ts"
          git config user.name "verto-staging-ci"
          git config user.email "verto-staging-ci@users.noreply.github.com"
          git add server.ts
          git commit -m "feat(P1-27): transact authenticated portal cancellation from proven sent 24h reminder"
          git push origin HEAD:refs/heads/fix/staging-p1-27-auto-cancel-from-24h-reminder-20261021
