name: Clinic route batch 02 focused regression
on:
  push:
    branches:
      - refactor/backend-server-route-batch02-20261011
permissions:
  contents: read
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --import tsx tests/clinicRouteBatch02Handlers.test.ts
      - run: node tests/serverRouteBatch02.regression.test.mjs
      - run: npm run typecheck
      - run: npm run build
