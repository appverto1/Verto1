name: One-shot owner admin read extraction
on:
  push:
    branches:
      - refactor/backend-owner-admin-read-batch-20261012
permissions:
  contents: write
concurrency:
  group: one-shot-owner-admin-read-extraction
  cancel-in-progress: true
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Guard original staging blob
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/refactor/backend-owner-admin-read-batch-20261012"
          test "$(git hash-object server.ts)" = "3b221575a18e3b01df24286168743e70bee8e06b"
          test ! -e services/ownerAdminReadHandlers.ts
      - run: npm ci
      - name: Extract nine handler bodies
        run: node scripts/one-shot-owner-admin-extract.mjs
      - name: Assert AST body and middleware parity
        run: |
          node tests/ownerAdminReadHandlersSourceParity.test.mjs
          node --import tsx tests/ownerAdminReadHandlers.test.ts
      - name: Build and typecheck
        run: |
          npm run typecheck
          npm run build
      - name: Verify minimal diff and publish branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -- scripts/one-shot-owner-admin-extract.mjs
          git add -- server.ts services/ownerAdminReadHandlers.ts tests/ownerAdminReadHandlersSourceParity.test.mjs tests/ownerAdminReadHandlers.test.ts docs/backend-modularization/20261012-owner-admin-read-batch.json docs/backend-modularization/20261012-owner-admin-read-batch.md scripts/backend-modularization-batch01-regressions.mjs
          git diff --cached --check
          git diff --cached --name-only > "$RUNNER_TEMP/changes.txt"
          cat "$RUNNER_TEMP/changes.txt"
          node -e "const fs=require('fs');const allowed=new Set(['scripts/one-shot-owner-admin-extract.mjs','server.ts','services/ownerAdminReadHandlers.ts','tests/ownerAdminReadHandlersSourceParity.test.mjs','tests/ownerAdminReadHandlers.test.ts','docs/backend-modularization/20261012-owner-admin-read-batch.json','docs/backend-modularization/20261012-owner-admin-read-batch.md','scripts/backend-modularization-batch01-regressions.mjs']);const diff=fs.readFileSync(process.env.RUNNER_TEMP+'/changes.txt','utf8').trim().split('\n').filter(Boolean);if(diff.some(p=>!allowed.has(p)))process.exit(1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(backend): extract nine owner and platform admin GET handlers"
          git push origin HEAD:refs/heads/refactor/backend-owner-admin-read-batch-20261012
