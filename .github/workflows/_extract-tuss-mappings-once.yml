name: One-time TUSS mapping route extraction

on:
  push:
    branches:
      - refactor/backend-tuss-mappings-route-batch-20261011

permissions:
  contents: write

jobs:
  extract:
    if: github.ref == 'refs/heads/refactor/backend-tuss-mappings-route-batch-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Strict reversible extraction
        run: node scripts/_extract-tuss-mappings-once.mjs
      - name: Focused HTTP authorization/contract tests
        run: node --import tsx tests/tussMappingRoutes.test.ts
      - name: Standalone typecheck of new backend module
        run: npx tsc --noEmit --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --esModuleInterop services/tussMappingRoutes.ts
      - name: Production frontend build
        run: npm run build
      - name: Commit only implementation, regression and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_extract-tuss-mappings-once.yml
          rm scripts/_extract-tuss-mappings-once.mjs
          git diff --check
          git add -- server.ts services/tussMappingRoutes.ts tests/tussMappingRoutes.test.ts docs/backend-modularization/20261011-tuss-mappings-route-batch.md .github/workflows/_extract-tuss-mappings-once.yml scripts/_extract-tuss-mappings-once.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "refactor(backend): extract TUSS mappings GET POST PATCH routes from server.ts"
          git push origin HEAD:refs/heads/refactor/backend-tuss-mappings-route-batch-20261011
