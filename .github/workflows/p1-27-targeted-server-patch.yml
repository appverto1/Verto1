name: P1 27 targeted backend patch
on:
  push:
    branches:
      - fix/staging-p1-27-24h-reminder-automatic-cancellation-20261022
    paths:
      - scripts/patch-p1-27-auto-cancel-server.mjs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact verified server patch
        run: |
          node scripts/patch-p1-27-auto-cancel-server.mjs
          git diff --check
          test "$(git diff --name-only)" = "server.ts"
          git config user.name "verto-staging-ci"
          git config user.email "verto-staging-ci@users.noreply.github.com"
          git add server.ts
          git commit -m "feat(p1-27): atomic automatic cancellation behind 24h delivery proof"
          git push origin HEAD:refs/heads/fix/staging-p1-27-24h-reminder-automatic-cancellation-20261022
