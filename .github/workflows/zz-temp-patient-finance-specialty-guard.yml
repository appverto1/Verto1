name: One-time patient financial specialty backend guard
on:
  push:
    branches:
      - fix/staging-financial-plan-specialty-active-team-20261014
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Register backend validation in canonical financial plan persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('server.ts')
          s=path.read_text()
          needle="} from './src/utils/patientFinancialPlan';"
          registration="import { validateActiveClinicFinancialPlanSpecialties } from './services/patientFinancialSpecialtyGuard';\n"
          if registration not in s:
              assert s.count(needle)==1, "Unexpected financial imports"
              s=s.replace(needle, needle+"\n"+registration)
          anchor="  let rows = buildPatientFinancialPlanRows({ ...params, financialPlans: persistencePlans });"
          validated="""
          const clinicFinancialSpecialties = await validateActiveClinicFinancialPlanSpecialties({
            supabase,
            clinicId: params.clinicId,
            patientId: params.patientId,
            rows
          });
          if (!clinicFinancialSpecialties.ok) {
            return { success: false, error: clinicFinancialSpecialties.error, code: clinicFinancialSpecialties.code };
          }
          """
          # Respect the existing INSURANCE preservation path: validate after its rows are excluded.
          if 'const clinicFinancialSpecialties = await validateActiveClinicFinancialPlanSpecialties' not in s:
              target="  const payerIds = Array.from(new Set(rows.map((row: any) => sanitizeString(row.payer_id, 120)).filter((id: string) => isUuid(id))));"
              assert s.count(anchor)==1 and s.count(target)==1, "Unexpected financial reconciliation anchors"
              s=s.replace(target,validated+"\n"+target)
          path.write_text(s)
          PY
          git diff --check
      - run: npm ci --no-audit --no-fund
      - run: npx tsx tests/patientFinancialPlanClinicSpecialty.regression.test.ts
      - run: npm run build
      - name: Commit only validated backend patch
        run: |
          rm -f .github/workflows/zz-temp-patient-finance-specialty-guard.yml
          git add server.ts .github/workflows/zz-temp-patient-finance-specialty-guard.yml
          git config user.name "Verto financial guard"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(finance): block inactive-specialty patient plans at persistence boundary"
          git push origin HEAD:fix/staging-financial-plan-specialty-active-team-20261014
