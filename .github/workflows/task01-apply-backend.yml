name: "One-time Verto Task 01 backend extraction"
on:
  push:
    branches:
      - refactor/critical-sellable-01-public-lead-20261104
    paths:
      - .github/workflows/task01-apply-backend.yml

permissions:
  contents: write

jobs:
  exact-extraction:
    if: github.repository == 'appverto1/Verto1' && github.ref == 'refs/heads/refactor/critical-sellable-01-public-lead-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact authorized feature branch
        uses: actions/checkout@v4
        with:
          ref: refactor/critical-sellable-01-public-lead-20261104
          persist-credentials: true
          fetch-depth: 2
      - name: Fail closed on unexpected history or files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "ce870c4acedb7f2641bfd4779c85800bfa1bf784"
          test "$(git hash-object server.ts)" = "48d27b07f17efff9b60e8d01e3ce28459c256981"
          test -z "$(git status --porcelain)"
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci
      - name: Verify exact route and apply only the authorized extraction
        shell: bash
        run: |
          set -euo pipefail
          node scripts/extract-public-sales-lead-route.mjs --dry-run
          node scripts/extract-public-sales-lead-route.mjs --apply
          test "$(git diff --name-only)" = "server.ts"
          test -f services/publicSalesLeadRoutes.ts
          git diff --check
      - name: Verify backend, frontend and CRM regression contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/publicSalesLeadRouteExtraction.regression.test.mjs
          node --import tsx tests/publicSalesLeadRouteBehavior.test.ts
          node tests/salesInterestSubmission.contract.test.mjs
          node --import tsx tests/salesInterestSubmission.behavior.test.ts
          node tests/salesWebsiteInterestKanban.regression.test.mjs
          node scripts/check-docker-runtime-imports.mjs
          npm run build
      - name: Commit only the backend extraction to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git add -- server.ts services/publicSalesLeadRoutes.ts
          test "$(git diff --cached --name-only)" = "$(printf 'server.ts\nservices/publicSalesLeadRoutes.ts')"
          git diff --cached --check
          git config user.name "verto-task01-ci"
          git config user.email "418+verto-task01-ci@users.noreply.github.com"
          git commit -m "refactor(sales): extract public lead handler into backend route module"
          git push origin "HEAD:refs/heads/refactor/critical-sellable-01-public-lead-20261104"
