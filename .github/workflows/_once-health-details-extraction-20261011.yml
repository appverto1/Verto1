name: Temporary health-details source extraction
on:
  push:
    branches:
      - refactor/backend-health-details-route-20261011
permissions:
  contents: write
jobs:
  extract:
    if: github.ref == 'refs/heads/refactor/backend-health-details-route-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Strict one-shot extraction
        run: node scripts/_once_extract_health_details_20261011.mjs
      - name: Deterministic dependencies
        run: npm ci
      - name: Functional and source parity regression
        run: |
          node --import tsx tests/healthDetailsRouteHandler.test.ts
          node tests/healthDetailsRouteExtraction.regression.test.mjs
      - name: Production build
        run: npm run build
      - name: Commit source diff and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "refactor/backend-health-details-route-20261011"
          rm .github/workflows/_once-health-details-extraction-20261011.yml
          rm scripts/_once_extract_health_details_20261011.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-only
          git diff --cached --check
          git commit -m "refactor(backend): extract health detail diagnostics from server entrypoint"
          git push origin HEAD:refs/heads/refactor/backend-health-details-route-20261011
