name: One-time backend patient time-report extraction
on:
  push:
    branches:
      - refactor/backend-patient-time-report-route-20261011

permissions:
  contents: write

concurrency:
  group: one-time-patient-time-report-extraction
  cancel-in-progress: false

jobs:
  extract-and-validate:
    if: github.repository == 'appverto1/Verto1' && github.ref == 'refs/heads/refactor/backend-patient-time-report-route-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Pin staging baseline and extract one unchanged route
        run: |
          git fetch --no-tags origin staging:refs/remotes/origin/staging
          node scripts/.once-extract-patient-time-report.mjs
      - name: Install dependencies
        run: npm ci
      - name: Focused HTTP authorization, tenant and error regression
        run: node --import tsx tests/patientTimeReportRoute.test.ts
      - name: Production bundle build (no deploy)
        run: npm run build
      - name: Remove temporary runner and publish branch-only result
        shell: bash
        run: |
          set -euo pipefail
          git rm -- scripts/.once-extract-patient-time-report.mjs .github/workflows/once-extract-patient-time-report.yml
          git add -- server.ts
          git diff --cached --check
          git diff --cached --stat
          git -c user.name='Verto Backend Modularization' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor(backend): extract patient time report GET handler from server.ts'
          git push origin HEAD:refs/heads/refactor/backend-patient-time-report-route-20261011
