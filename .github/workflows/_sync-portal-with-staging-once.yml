name: One-time staging sync and historical ABA parity fix for portal extraction
on:
  push:
    branches:
      - refactor/backend-portal-appointments-read-batch-20261013
permissions:
  contents: write
concurrency:
  group: portal-read-staging-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync:
    if: github.ref == 'refs/heads/refactor/backend-portal-appointments-read-batch-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Fast-forward reference validation and merge staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin staging
          test "$(git rev-parse origin/staging)" = "b8928ebe3ee93a2ed5557307b4459d2fc6479e37"
          git merge --no-ff --no-edit origin/staging
      - name: Preserve historical ABA full-source equivalence and current route invariants
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const path='tests/abaChartReadHandlers.test.ts';
          const old=fs.readFileSync(path,'utf8');
          const needle="let recovered = current.replace(imp,'').replace(factory,'');";
          if(old.split(needle).length!==2) throw Error('ABA regression test moved; stop');
          const update=[
            '// Compare the historical ABA extraction against its merge commit; subsequent',
            '// independent server.ts extractions must not invalidate this source fixture.',
            "const abaExtractionMerge = 'b8928ebe3ee93a2ed5557307b4459d2fc6479e37';",
            "const historicalExtracted = execFileSync('git', ['show', abaExtractionMerge + ':server.ts'], { encoding: 'utf8', maxBuffer: 12000000 });",
            "assert.ok(historicalExtracted.startsWith(imp), 'ABA extraction import at historical merge');",
            "let recovered = historicalExtracted.replace(imp,'').replace(factory,'');",
          ].join('\n');
          const updated=old.replace(needle,update).replace(
            "assert.equal(recovered,original,'exact full-source roundtrip');",
            "assert.equal(recovered,original,'exact historical ABA full-source roundtrip');"
          );
          if(updated===old) throw Error('no modification');
          fs.writeFileSync(path,updated);
          NODE
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline --fetch-retries=1 --fetch-timeout=60000
      - name: Both domain regressions and historical source parity
        run: |
          set -euo pipefail
          node --import tsx tests/abaChartReadHandlers.test.ts
          node --import tsx tests/portalAppointmentReadHandlers.test.ts
      - name: Production build
        run: npm run build
      - name: Remove disposable workflow before publishing only domain and compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_sync-portal-with-staging-once.yml
          git diff --check
          git add -A -- .github/workflows/_sync-portal-with-staging-once.yml tests/abaChartReadHandlers.test.ts
          git diff --cached --check
          git commit -m "test(backend): preserve ABA source parity across later independent server extractions"
          git push origin HEAD:refs/heads/refactor/backend-portal-appointments-read-batch-20261013
