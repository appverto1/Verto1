name: Temporary patient graph sharing server patch

on:
  push:
    branches:
      - feat/staging-controlled-child-graph-sharing-20261018

permissions:
  contents: write

jobs:
  apply-scoped-server-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/staging-controlled-child-graph-sharing-20261018
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply checked patch
        run: node scripts/patch-patient-shared-graph-server.mjs
      - name: Commit only changed server
        run: |
          if git diff --quiet -- server.ts; then
            echo 'Already integrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'feat(graphs): register restricted portal and clinic graph routes'
          git push origin HEAD:feat/staging-controlled-child-graph-sharing-20261018
