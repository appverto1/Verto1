name: Temporary item 07 checkout backend final regression validation
on:
  push:
    branches:
      - refactor/critical-07-checkout-backend-20261107
permissions:
  contents: write
concurrency:
  group: item07-extraction-validation
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Extract source and run Node20 gate without Stripe network calls
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/item07-validation.log"
          set +e
          (
            set -e
            npm ci --no-audit --no-fund
            python3 scripts/_temporary_item07_extract.py
            node scripts/_temporary_item07_deps.mjs
            npx tsx tests/publicSalesCheckoutBackendRoutes.behavior.test.ts
            node tests/salesCheckoutBackendExtraction.regression.test.mjs
            npm run build
            npm run check:docker-runtime-imports
            set +e
            npm run check:pre-main > "$RUNNER_TEMP/item07-head-pre-main.log" 2>&1
            HEAD_STATUS=$?
            set -e
            tail -n 16 "$RUNNER_TEMP/item07-head-pre-main.log"
            if [ "$HEAD_STATUS" -ne 0 ]; then
              echo "Running source-equal staging baseline for pre-main ratchet."
              git worktree add --detach "$RUNNER_TEMP/item07-base" 35e426feb6670b7a26f89cb86bbba4d378425e48
              (
                cd "$RUNNER_TEMP/item07-base"
                ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
                set +e
                npm run check:pre-main > "$RUNNER_TEMP/item07-base-pre-main.log" 2>&1
                echo "$?" > "$RUNNER_TEMP/item07-base-status"
              )
              if [ "$(cat "$RUNNER_TEMP/item07-base-status")" -eq 0 ]; then
                echo "FAIL: baseline clean but candidate failed."
                exit 1
              fi
              python3 - "$RUNNER_TEMP/item07-head-pre-main.log" "$RUNNER_TEMP/item07-base-pre-main.log" <<'PYRAT'
          from pathlib import Path
          import sys,re
          def failures(path):
              text=Path(path).read_text()
              return set(re.findall(r'^\s*✗\s+([^—\n]+)',text,re.M))
          head=failures(sys.argv[1]);base=failures(sys.argv[2])
          print('BASELINE_FAILURES',sorted(base))
          print('HEAD_FAILURES',sorted(head))
          new=head-base
          print('NEW_FAILURES',sorted(new))
          if new: raise SystemExit(1)
          print('ITEM07_PREMAIN_RATCHET_PASS')
          PYRAT
            fi
            echo "ITEM07_ALL_LOCAL_GATES_PASS"
          ) > "$LOG" 2>&1
          CODE=$?
          set -e
          echo "ITEM07_VALIDATION_EXIT=$CODE"
          tail -n 100 "$LOG" || true
          git config user.name 'verto-audit-bot'
          git config user.email 'verto-audit-bot@users.noreply.github.com'
          if [ "$CODE" -ne 0 ]; then
            {
              echo "ITEM07_VALIDATION_EXIT=$CODE"
              tail -n 170 "$LOG"
            } > docs/operations/_temporary_item07_result.txt
            git add docs/operations/_temporary_item07_result.txt
            git commit -m 'chore(audit): item07 validation diagnosis [skip ci]'
            git push
            exit 1
          fi
          git rm .github/workflows/critical-07-temp.yml docs/operations/_temporary_item07_inspection.txt scripts/_temporary_item07_extract.py scripts/_temporary_item07_deps.mjs
          if [ -f docs/operations/_temporary_item07_result.txt ]; then
            git rm -f docs/operations/_temporary_item07_result.txt
          fi
          git add server.ts services/salesModularCheckoutCore.ts services/publicSalesCheckoutRoutes.ts tests scripts/pre-main-gate.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'refactor(staging): modularize item07 public acceptance and Stripe Checkout backend'
          git push
          echo "ITEM07_EXTRACTED_AND_COMMITTED"
