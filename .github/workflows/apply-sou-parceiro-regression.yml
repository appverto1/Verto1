name: Apply validated Sou Parceiro regression

on:
  push:
    branches:
      - fix/ui-sou-parceiro-space-regression-20260913

permissions:
  contents: write

jobs:
  apply-validated-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify authorized base and apply exact validated change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fb21d9f69cd7d1de317ba4448ffa4b4573d77e82"
          test "$(git hash-object src/components/LandingPage.tsx)" = "061d21096a6264f19e2fdbb8d571d767429661c2"
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/LandingPage.tsx')
          s = p.read_text(encoding='utf-8')
          old = '              <span className="hidden sm:inline">Sou </span>parceiro\n'
          new = '              Sou parceiro\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly 1 old occurrence, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          test "$(git hash-object src/components/LandingPage.tsx)" = "9d54f3c6fa18ae329e698ddb665b63e674b926bd"
          test "$(grep -o 'Sou parceiro' src/components/LandingPage.tsx | wc -l | tr -d ' ')" = "2"
          ! grep -Fq 'Souparceiro' src/components/LandingPage.tsx
          ! grep -Fq 'Sou profissional parceiro' src/components/LandingPage.tsx
          ! grep -Fq '<span className="hidden sm:inline">Sou </span>parceiro' src/components/LandingPage.tsx
          grep -Fq "window.location.href = '/rede-de-cuidado';" src/components/LandingPage.tsx
          git diff --check

      - name: Commit and push validated implementation only
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-sou-parceiro-regression.yml
          git add src/components/LandingPage.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ui): preserve partner label spacing"
          git push origin HEAD:fix/ui-sou-parceiro-space-regression-20260913
