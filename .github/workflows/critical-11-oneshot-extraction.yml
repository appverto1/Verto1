name: Verto item 11 one-shot Director password route extraction

on:
  push:
    branches:
      - refactor/critical-11-director-password-20261106
    paths:
      - .github/workflows/critical-11-oneshot-extraction.yml

permissions:
  contents: write

jobs:
  extract-once:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Verify base and extract unchanged password activation route
        run: python3 scripts/critical-11-oneshot-extraction.py
      - name: Verify only server.ts changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          diff -u <(printf '%s\n' 'server.ts') <(git diff --name-only | sort)
          test -f services/publicSalesActivationPasswordRoute.ts
      - name: Commit extraction and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git rm scripts/critical-11-oneshot-extraction.py .github/workflows/critical-11-oneshot-extraction.yml
          git diff --cached --check
          git commit -m 'refactor(staging): extrair rota de ativacao por senha do Diretor (item 11)'
          git push origin HEAD:refactor/critical-11-director-password-20261106
