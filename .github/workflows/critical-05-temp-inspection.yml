name: Critical 05 temporary extraction gate
on:
  push:
    branches:
      - audit/critical-05-links-20261107
permissions:
  contents: write
concurrency:
  group: critical05-temporary-extraction
  cancel-in-progress: false
jobs:
  extract-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply source-exact extraction and run gates
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/critical05.log"
          mkdir -p docs/operations
          set +e
          {
            npm ci --no-audit --no-fund
            if [ $? -eq 0 ]; then
              base64 -d scripts/_temporary_critical05_extract.gz.b64 | gzip -d > "$RUNNER_TEMP/critical05.py"
              python3 - "$RUNNER_TEMP/critical05.py" <<'PYPATCH'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          old = 'return ("import type Stripe from \'stripe\';\\n"'
          new = 'return ("import type Stripe from \'stripe\';\\n" + "import type { SalesSimulationInput, SalesUsageProfile } from \'../src/utils/salesProfitability\';\\n"'
          if s.count(old)!=1: raise RuntimeError('Unexpected extractor source structure')
          s=s.replace(old,new)
          a=s.index("test('route delegates only server actor")
          b=s.index("test('route cannot treat invalid records", a)
          corrected = """test('modular preparation rejects role spoofing before any write', async()=>{
           const s=setup('modular');const res=s.response();
           await s.handler(s.request({leadId:uuid,simulationId:other,contractEmail:'director@example.com',actorUserId:other}),res);
           assert.equal(res.statusCode,403);
           assert.equal(res.body.code,'PROPOSAL_ACCESS_DENIED');
          });

          test('owner with valid MFA still requires selected canonical simulation', async()=>{
           const s=setup('modular');const registered=[];
           registerOwnerSalesOfferCreationRoute({...s.deps,app:{post:(...parts)=>registered.push(parts)},hasVerifiedMfaSession:()=>true} as any);
           const req=s.request({leadId:uuid,simulationId:other,contractEmail:'director@example.com',actorUserId:other});
           req.session.user.isPlatformAdmin=true;
           const res=s.response();
           await registered[0][3](req,res);
           assert.equal(res.statusCode,409);
           assert.equal(res.body.code,'PROPOSAL_SIMULATION_INVALID');
          });

          """
          s=s[:a]+corrected+s[b:]
          p.write_text(s)
          PYPATCH
              python3 "$RUNNER_TEMP/critical05.py" && \
              npx tsx tests/ownerSalesOfferCreationRoutes.behavior.test.ts && \
              node tests/ownerSalesOfferCreationRoutes.regression.test.mjs && \
              npm run check:pre-main && \
              npm run build
            else
              echo "npm ci failed"
              exit 1
            fi
          } > "$LOG" 2>&1
          CODE=$?
          set -e
          echo "ITEM05_GATE_EXIT=$CODE"
          tail -n 120 "$LOG" || true
          git config user.name 'verto-audit-bot'
          git config user.email 'verto-audit-bot@users.noreply.github.com'
          if [ "$CODE" -ne 0 ]; then
            {
              echo "ITEM05_GATE_EXIT=$CODE"
              tail -n 220 "$LOG"
            } > docs/operations/_temporary_item05_job_result.txt
            git add docs/operations/_temporary_item05_job_result.txt
            git commit -m 'chore(audit): preserve item05 gate diagnosis [skip ci]'
            git push
            exit 0
          fi
          git rm .github/workflows/critical-05-temp-inspection.yml scripts/_temporary_critical05_extract.gz.b64 docs/operations/_temporary_item05_backend_inspection.txt
          rm -f scripts/_temporary_item05_checker.mjs docs/operations/_temporary_item05_job_result.txt
          git add server.ts services/ownerSalesOfferCreationRoutes.ts tests/ownerSalesOfferCreationRoutes.regression.test.mjs tests/ownerSalesOfferCreationRoutes.behavior.test.ts tests/salesContractIdentity.test.ts tests/salesOfferSchemaRepair20260830.regression.test.mjs tests/salesOfferPositiveBaseRepair20260831.regression.test.mjs tests/salesCurrentOperatingSalesGate20260901.regression.test.mjs scripts/pre-main-gate.mjs
          git diff --cached --stat
          git commit -m 'refactor(staging): modularize item05 owner sales offer creation and recovery'
          git push
          echo "ITEM05_GATE_SUCCESS_AND_COMMITTED"
