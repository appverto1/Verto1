name: One-time scoped specialty plan patch
on:
  push:
    branches:
      - fix/specialty-therapeutic-plan-case-member-create-staging-20261010
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'chore: trigger scoped specialty plan patch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch only targeted authorization routes and remove temporary tooling
        run: |
          node scripts/applySpecialtyCasePlanFixOnce.mjs
          git rm -- scripts/applySpecialtyCasePlanFixOnce.mjs .github/workflows/one-time-scoped-plan-patch.yml
          git add server.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(P0): case-scoped specialty plans honor authenticated professional access"
          git push origin HEAD:fix/specialty-therapeutic-plan-case-member-create-staging-20261010
