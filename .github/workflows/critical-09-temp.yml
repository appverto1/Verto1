name: Temporary item09 Stripe module typecheck and regression gate
on:
  push:
    branches:
      - refactor/critical-09-stripe-core-20261107
permissions:
  contents: write
concurrency:
  group: item09-stripe-core-gate
  cancel-in-progress: false
jobs:
  extract-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Source-exact Stripe extraction, security and regression tests
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/item09-gate.log"
          set +e
          (
            set -e
            npm ci --no-audit --no-fund
            python3 scripts/_temporary_item09_extract.py
            node scripts/_temporary_item09_deps.mjs
            python3 scripts/_temporary_item09_adjust_tests.py
            node tests/stripeWebhookCoreExtraction.regression.test.mjs
            npx tsx tests/stripeWebhookEventState.behavior.test.ts
            npx tsx tests/salesModularSubscriptionSchedule.behavior.test.ts
            npm run build
            npm run check:docker-runtime-imports
            set +e
            npm run check:pre-main > "$RUNNER_TEMP/item09-head-premain.log" 2>&1
            HEAD_CODE=$?
            set -e
            echo "ITEM09_PREMAIN_CANDIDATE_EXIT=$HEAD_CODE"
            grep -E '^[[:space:]]*✗[[:space:]]+' "$RUNNER_TEMP/item09-head-premain.log" || true
            if [ "$HEAD_CODE" -ne 0 ]; then
              git worktree add --detach "$RUNNER_TEMP/item09-staging" 30d57fe3f825a20414c8b70b5211501ff004c39a
              (
                cd "$RUNNER_TEMP/item09-staging"
                ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
                set +e
                npm run check:pre-main > "$RUNNER_TEMP/item09-base-premain.log" 2>&1
                echo "$?" > "$RUNNER_TEMP/item09-base-code"
              )
              if [ "$(cat "$RUNNER_TEMP/item09-base-code")" -eq 0 ]; then
                echo "BLOCKED: baseline passes but candidate fails"
                exit 1
              fi
              python3 - "$RUNNER_TEMP/item09-head-premain.log" "$RUNNER_TEMP/item09-base-premain.log" <<'PYRAT'
          from pathlib import Path
          import re,sys
          def errors(path):
            return set(re.findall(r'^\s*✗\s+([^—\n]+)',Path(path).read_text(),re.M))
          head=errors(sys.argv[1]);base=errors(sys.argv[2])
          print('BASELINE_FAILURES',sorted(base))
          print('CANDIDATE_FAILURES',sorted(head))
          new=head-base
          print('NEW_REGRESSIONS',sorted(new))
          if new: raise SystemExit(1)
          print('ITEM09_PREMAIN_RATCHET_SUCCESS')
          PYRAT
            fi
            echo "ITEM09_SOURCE_AND_TEST_GATES_SUCCESS"
          ) > "$LOG" 2>&1
          EXIT=$?
          set -e
          echo "ITEM09_GATE_EXIT=$EXIT"
          tail -n 115 "$LOG" || true
          git config user.name 'verto-audit-bot'
          git config user.email 'verto-audit-bot@users.noreply.github.com'
          if [ "$EXIT" -ne 0 ]; then
            {
              echo "ITEM09_GATE_EXIT=$EXIT"
              head -n 45 "$LOG"
              echo "... END OF RESULT ..."
              tail -n 180 "$LOG"
            } > docs/operations/_temporary_item09_result.txt
            git add docs/operations/_temporary_item09_result.txt
            git commit -m 'chore(audit): item09 validation diagnosis [skip ci]'
            git push
            exit 0
          fi
          git rm .github/workflows/critical-09-temp.yml scripts/_temporary_item09_extract.py scripts/_temporary_item09_deps.mjs scripts/_temporary_item09_adjust_tests.py docs/operations/_temporary_item09_inspection.txt docs/operations/_temporary_item09_more.txt
          if [ -f docs/operations/_temporary_item09_result.txt ]; then
            git rm docs/operations/_temporary_item09_result.txt
          fi
          git add server.ts services/stripeWebhookEventState.ts services/salesSubscriptionDiscountSync.ts services/salesAssistedCheckoutPaymentProcessor.ts services/salesSubscriptionFinancialReconciliation.ts services/salesModularSubscriptionSchedule.ts services/salesSubscriptionEntitlementTransitions.ts scripts/pre-main-gate.mjs tests
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'refactor(staging): modularize critical item09 Stripe webhook and subscription core'
          git push
          echo "ITEM09_EXTRACTED_COMMITTED"
