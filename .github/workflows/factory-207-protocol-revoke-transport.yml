name: Factory 207 Safe Transport

on:
  push:
    branches:
      - factory/207-protocol-grant-revoke-ci-a3

permissions:
  contents: write

concurrency:
  group: factory-207-protocol-grant-revoke-ci-a3
  cancel-in-progress: false

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: factory/207-protocol-grant-revoke-ci-a3

      - name: Guard expected implementation parent
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 82fce4471ca3642d30a3551fe6f71bc2a67ba119 HEAD
          test "$(git rev-list --count 82fce4471ca3642d30a3551fe6f71bc2a67ba119..HEAD)" -eq 2

      - name: Apply exact anchored patch
        run: python3 scripts/factory-207-protocol-revoke-patch.py

      - name: Targeted contract regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/protocolGrantRevokeMigration.regression.test.mjs
          node tests/protocolGrantRevokeIntegration.regression.test.mjs
          git diff --check

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Remove transport-only files and verify scoped diff
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/factory-207-protocol-revoke-patch.py
          rm .github/workflows/factory-207-protocol-revoke-transport.yml
          git add -A
          git diff --cached --check
          mapfile -t files < <(git diff --cached --name-only)
          printf '%s\n' "${files[@]}"
          expected=(
            "server.ts"
            "src/components/Protocols.tsx"
            "src/components/SuperAdminDashboard.tsx"
            "tests/protocolGrantRevokeIntegration.regression.test.mjs"
            "scripts/factory-207-protocol-revoke-patch.py"
            ".github/workflows/factory-207-protocol-revoke-transport.yml"
          )
          for file in "${files[@]}"; do
            case "$file" in
              server.ts|src/components/Protocols.tsx|src/components/SuperAdminDashboard.tsx|tests/protocolGrantRevokeIntegration.regression.test.mjs|scripts/factory-207-protocol-revoke-patch.py|.github/workflows/factory-207-protocol-revoke-transport.yml) ;;
              *) echo "::error::Unexpected file in candidate: $file"; exit 1 ;;
            esac
          done

      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "verto-factory"
          git config user.email "factory@users.noreply.github.com"
          git commit -m "fix(protocols): wire canonical grant revocation (#207)"
          git push origin HEAD:factory/207-protocol-grant-revoke-ci-a3
