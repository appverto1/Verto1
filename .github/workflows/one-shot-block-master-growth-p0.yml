name: One-shot P0 close legacy chart portal bypass
on:
  push:
    branches:
      - feat/p0-case-global-chart-governance-20261023
permissions:
  contents: write
concurrency:
  group: verto-one-shot-p0-chart-20261023
  cancel-in-progress: false
jobs:
  close-legacy-portal:
    if: github.ref == 'refs/heads/feat/p0-case-global-chart-governance-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/one-shot-block-master-growth-p0.mjs
