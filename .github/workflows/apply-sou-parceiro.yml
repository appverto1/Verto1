name: Apply validated Sou Parceiro artifact

on:
  push:
    branches:
      - ui/sou-parceiro-20260913

permissions:
  contents: write

jobs:
  apply-validated-file:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui/sou-parceiro-20260913
          fetch-depth: 0

      - name: Verify authorized base and apply exact validated change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4160a066878084485bcb668fcef9c4450a3a359c"
          test "$(git rev-parse 4160a066878084485bcb668fcef9c4450a3a359c:src/components/LandingPage.tsx)" = "145c18bad04fda1e90346419b335a19b1b38a689"
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/LandingPage.tsx')
          text = path.read_text(encoding='utf-8')
          old1 = '<span className="block text-sm font-semibold text-slate-900">Sou profissional parceiro</span>'
          new1 = '<span className="block text-sm font-semibold text-slate-900">Sou parceiro</span>'
          old2 = '<span className="hidden sm:inline">Sou profissional </span>parceiro'
          new2 = '<span className="hidden sm:inline">Sou </span>parceiro'
          assert text.count(old1) == 1, text.count(old1)
          assert text.count(old2) == 1, text.count(old2)
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          path.write_text(text, encoding='utf-8')
          PY
          test "$(git hash-object src/components/LandingPage.tsx)" = "061d21096a6264f19e2fdbb8d571d767429661c2"
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "src/components/LandingPage.tsx"

      - name: Commit and push validated implementation only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-sou-parceiro.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/LandingPage.tsx .github/workflows/apply-sou-parceiro.yml
          git diff --cached --name-status
          git commit -m 'fix(ui): rename partner access label'
          git push origin HEAD:ui/sou-parceiro-20260913
