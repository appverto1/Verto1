name: Temporary item10 paid Director backend validation
on:
  push:
    branches:
      - refactor/critical-10-paid-director-backend-20261107
permissions:
  contents: write
concurrency:
  group: item10-paid-director-source-gate
  cancel-in-progress: true
jobs:
  extract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Run source-exact extraction and stop on security/build regressions
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/item10-validation.log"
          set +e
          (
            set -e
            npm ci --no-audit --no-fund
            python3 scripts/_temporary_item10_extract.py
            node scripts/_temporary_item10_deps.mjs
            node tests/salesPaidDirectorBackendExtraction.regression.test.mjs
            npx tsx tests/publicSalesPostPaymentReconciliationRoute.behavior.test.ts
            npm run build
            npm run check:docker-runtime-imports
            set +e
            npm run check:pre-main > "$RUNNER_TEMP/item10-pre-main.log" 2>&1
            code=$?
            set -e
            python3 - "$RUNNER_TEMP/item10-pre-main.log" "$code" <<'PYRAT'
          import sys,re
          from pathlib import Path
          text=Path(sys.argv[1]).read_text()
          status=int(sys.argv[2])
          failed=set(x.strip() for x in re.findall(r'^\s*✗\s+teste:\s+([^—\n]+)',text,re.M))
          known={'tests/factoryBlockerCatalog.regression.test.mjs','tests/p3SidebarNoHorizontalScroll.regression.test.mjs'}
          print('ITEM10_PREMAIN_EXIT',status,'FAILURES',sorted(failed),'UNEXPECTED',sorted(failed-known))
          if (status!=0 and not failed) or (failed-known):raise SystemExit(1)
          print('ITEM10_PREMAIN_NO_NEW_FAILURES (official PR CI ratchet still required)')
          PYRAT
            echo ITEM10_LOCAL_GATES_PASS
          ) > "$LOG" 2>&1
          CODE=$?
          set -e
          echo "ITEM10_GATE_EXIT=$CODE"
          tail -n 125 "$LOG" || true
          git config user.name verto-audit-bot
          git config user.email verto-audit-bot@users.noreply.github.com
          if [ "$CODE" -ne 0 ]; then
            {
              echo "ITEM10_GATE_EXIT=$CODE"
              head -n 45 "$LOG"
              echo '... END ...'
              tail -n 180 "$LOG"
            } > docs/operations/_temporary_item10_result.txt
            git add docs/operations/_temporary_item10_result.txt
            git commit -m 'chore(audit): item10 validation diagnosis [skip ci]'
            git push
            exit 0
          fi
          git rm .github/workflows/critical-10-temp.yml scripts/_temporary_item10_extract.py scripts/_temporary_item10_deps.mjs docs/operations/_temporary_item10_source_inventory.txt
          if [ -f docs/operations/_temporary_item10_result.txt ]; then
            git rm docs/operations/_temporary_item10_result.txt
          fi
          git add server.ts services/paidDirectorSessionBootstrap.ts services/publicSalesPostPaymentReconciliationRoute.ts services/salesDirectorContractAccess.ts services/salesPaidDirectorAccountProvisioning.ts scripts/pre-main-gate.mjs tests
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'refactor(staging): modularize item10 paid Director post-payment backend'
          git push
          echo ITEM10_SOURCE_TESTED_AND_COMMITTED
