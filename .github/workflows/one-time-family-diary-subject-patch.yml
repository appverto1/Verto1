name: One-time legacy family subject guard
on:
  pull_request:
    branches:
      - staging
    paths:
      - .github/workflows/one-time-family-diary-subject-patch.yml

permissions:
  contents: write

jobs:
  bounded-server-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/staging-family-diary-legacy-stars-complete-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact server note subject authorization patch
        run: node scripts/oneTimeFamilyDiaryLegacySubjectPatch.mjs
      - name: Verify and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "server.ts"
          git rm .github/workflows/one-time-family-diary-subject-patch.yml
          git rm scripts/oneTimeFamilyDiaryLegacySubjectPatch.mjs
          git add server.ts
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(staging): require patient write scope for legacy family note subjects'
          git push origin HEAD:fix/staging-family-diary-legacy-stars-complete-20261021
