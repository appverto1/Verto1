name: Verto item 10 one-shot paid Director route extraction

on:
  push:
    branches:
      - refactor/critical-10-paid-director-session-20261106
    paths:
      - .github/workflows/critical-10-oneshot-extraction.yml

permissions:
  contents: write

jobs:
  extract-once:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Verify and extract only Director session route
        run: python3 scripts/critical-10-oneshot-extraction.py
      - name: Review one-file server diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          diff -u <(printf '%s\n' 'server.ts') <(git diff --name-only | sort)
          test -f services/publicSalesDirectorSessionRoute.ts
      - name: Commit without retaining one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git rm scripts/critical-10-oneshot-extraction.py .github/workflows/critical-10-oneshot-extraction.yml
          git diff --cached --check
          git commit -m 'refactor(staging): extract paid Director session route from server.ts (item 10)'
          git push origin HEAD:refactor/critical-10-paid-director-session-20261106
