name: Verto Staging CI

on:
  pull_request:
    branches:
      - staging
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verto-staging-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-gate:
    name: staging-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      group-postgres:
        image: postgres:17
        env:
          POSTGRES_DB: verto_group_regression
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: group_session_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d verto_group_regression"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci

      - name: IA-03 privileged RPC execute grants regression
        run: node tests/ia03PrivilegedDirectRpcAcl.regression.test.mjs

      - name: IA-04 trigger ACL and real PostgreSQL firing regression
        env:
          VERTO_IA04_POSTGRES_TEST: "1"
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: group_session_ci_only
          PGDATABASE: verto_group_regression
        run: node tests/ia04SecdefTriggerAcl.regression.test.mjs

      - name: IA-05 scoped privilege regression (RPC anon and table TRIGGER)
        env:
          VERTO_IA05_POSTGRES_TEST: "1"
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: group_session_ci_only
          PGDATABASE: verto_group_regression
        run: node tests/ia05SecdefAnonAndTableTriggerAcl.regression.test.mjs

      - name: IA-05 remaining table TRIGGER grants and default ACL regression
        env:
          VERTO_IA05_POSTGRES_TEST: "1"
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: group_session_ci_only
          PGDATABASE: verto_group_regression
        run: node tests/ia05RemainingTableTriggerGrants.regression.test.mjs

      - name: IA-06 internal SECDEF direct-call regression
        env:
          VERTO_IA06_POSTGRES_TEST: "1"
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: group_session_ci_only
          PGDATABASE: verto_group_regression
        run: node tests/ia06InternalAuthenticatedSecdefAcl.regression.test.mjs

      - name: IA-06 actor identity RLS isolation regression
        env:
          VERTO_IA06_POSTGRES_TEST: "1"
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: group_session_ci_only
          PGDATABASE: verto_group_regression
        run: node tests/ia06SelfActorSecdefRls.regression.test.mjs

      - name: IA-06 clinical and onboarding tenant isolation regression
        env:
          VERTO_IA06_POSTGRES_TEST: "1"
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: group_session_ci_only
          PGDATABASE: verto_group_regression
        run: node tests/ia06ClinicalOnboardingRevocation.regression.test.mjs

      - name: IA-06 protected user fields backend-authoritative regression
        env:
          VERTO_IA06_POSTGRES_TEST: "1"
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: group_session_ci_only
          PGDATABASE: verto_group_regression
        run: node tests/ia06UsersPrivilegedFields.regression.test.mjs

      - name: IA-06 revoked legacy clinic scope regression
        env:
          VERTO_IA06_POSTGRES_TEST: "1"
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: group_session_ci_only
          PGDATABASE: verto_group_regression
        run: node tests/ia06LegacyClinicRevocation.regression.test.mjs

      - name: Patient Drive free tier regression tests
        run: |
          node tests/patientFileStorageQuota.test.mjs
          node tests/patientFileFreeTier.test.mjs

      - name: Patient WhatsApp DDD and link regression tests
        run: node --import tsx tests/patientWhatsapp.test.ts

      - name: ABA behavior catalog CRUD and touch gesture regressions
        run: |
          node --import tsx tests/abaBehaviorCatalog.test.ts
          node tests/abaBehaviorCatalogCrudAndGesture.regression.test.mjs
          node tests/abaSessionQuickCollectionPersistence.regression.test.mjs

      - name: ABA behavior catalog CRUD and pinned gesture regressions
        run: |
          node --import tsx tests/abaBehaviorCatalog.test.ts
          node tests/abaBehaviorCatalogCrudAndGesture.regression.test.mjs

      - name: Patient card pending-only regressions
        run: |
          node --import tsx tests/patientCardPendingState.test.ts
          node tests/patientCardPendingOnly.regression.test.mjs
          node tests/anamnesisProfessionalCapability.regression.test.mjs
          node tests/anamnesisSavePersistenceConfirmation.regression.test.mjs

      - name: Password recovery and owner MFA regression tests
        run: |
          npm run test:auth-login-recovery-fallback
          npm run test:owner-mfa

      - name: Portal role isolation and Google OAuth password-flash regressions
        run: |
          node --import tsx tests/authLoginPortalPolicy.test.ts
          node tests/googleOAuthPasswordFlash.regression.test.mjs

      - name: Typecheck ratchet regression tests
        run: node tests/typecheckRatchet.regression.test.mjs

      - name: Typecheck ratchet
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -uo pipefail

          HEAD_LOG="$RUNNER_TEMP/typecheck-head.log"
          BASE_LOG="$RUNNER_TEMP/typecheck-base.log"
          NEW_LOG="$RUNNER_TEMP/typecheck-new.log"
          BASE_WORKTREE="$RUNNER_TEMP/verto-base"

          set +e
          npm run typecheck >"$HEAD_LOG" 2>&1
          HEAD_STATUS=$?
          set -e
          cat "$HEAD_LOG"

          if [ "$HEAD_STATUS" -eq 0 ]; then
            echo "Typecheck clean on candidate commit."
            exit 0
          fi

          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::Typecheck failed and no valid baseline SHA is available."
            exit "$HEAD_STATUS"
          fi

          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if [ ! -f "$BASE_WORKTREE/package.json" ]; then
            git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          fi

          pushd "$BASE_WORKTREE" >/dev/null
          if [ ! -d node_modules ]; then
            npm ci --prefer-offline --no-audit
          fi
          set +e
          npm run typecheck >"$BASE_LOG" 2>&1
          BASE_STATUS=$?
          set -e
          popd >/dev/null

          if [ "$BASE_STATUS" -eq 0 ]; then
            echo "::error::Baseline typecheck passes but candidate typecheck fails."
            exit "$HEAD_STATUS"
          fi

          set +e
          node scripts/typecheck-ratchet.mjs \
            --candidate "$HEAD_LOG" \
            --baseline "$BASE_LOG" \
            --output "$NEW_LOG"
          RATCHET_STATUS=$?
          set -e

          if [ "$RATCHET_STATUS" -ne 0 ]; then
            echo "::error::Typecheck ratchet rejected candidate diagnostics relative to staging baseline:"
            cat "$NEW_LOG"
            exit "$RATCHET_STATUS"
          fi

          echo "::warning::Typecheck contains only pre-existing staging diagnostics; no new TypeScript diagnostic was introduced."

      - name: Production build
        run: npm run build

      - name: ABA behavior capture UI regressions
        run: |
          node tests/abaDurationStartMinimalToast.regression.test.mjs
          node tests/abaBehaviorCollectionMinimalPanels.regression.test.mjs

      - name: Partnership public registration and authorization regressions
        run: |
          node --import tsx tests/partnershipSecurity.test.ts
          node --import tsx tests/partnerReferralCoupon.test.ts
          node tests/partnerReferralCrmReporting.regression.test.mjs
          node --import tsx tests/partnerMarketplaceSecurity.test.ts
          node --import tsx tests/partnerMarketplaceImageUpload.test.ts
          node --import tsx tests/partnerApprovalFlow.test.ts
          node --import tsx tests/partnershipEmailCallback.test.ts
          node tests/landingSignupFirstEntry.regression.test.mjs
          node tests/externalPartnerOnboardingHub20260903.regression.test.mjs

      - name: Notification and scheduling regression tests
        run: |
          node tests/mobileClinicHeaderOnlyMenuBell.regression.test.mjs
          node tests/p0PatientSharedChartPortalPriority.regression.test.mjs
          node tests/patientPortalMenuClipping.regression.test.mjs
          node tests/patientNotificationPushPresentation.test.mjs
          node --import tsx tests/notificationBranding.test.ts
          node tests/notificationAgendaPresentation.regression.test.mjs
          node --import tsx tests/clinicAnnouncementBrazilTime.test.ts
          node --import tsx tests/p0AppointmentReminderClaimIntegrity.test.ts
          node --import tsx tests/portalRescheduleRequestLifecycle.regression.test.ts
          node tests/rescheduleApprovalClinicAuthorizedRoles.regression.test.mjs
          node tests/rescheduleApprovalDelegatedAgendaCapability.regression.test.mjs
          node tests/portalRescheduleSubmissionAndReminderCycle.regression.test.mjs
          node tests/p127PortalReminderOrigin.regression.test.mjs
          node tests/p127Portal24hReminderCancellation.test.mjs

      - name: Family diary unread and professional history regressions
        run: |
          node --import tsx tests/familyDiaryUnread.test.ts
          node tests/familyDiaryProfessionalSubtab.regression.test.mjs
          node tests/familyDiaryPersistence.regression.test.mjs
          node tests/familyDiaryMilestoneSafety.regression.test.mjs
          node --import tsx tests/familyDiaryStars.test.ts
          node tests/familyDiaryLegacyStarsSecurity.regression.test.mjs

      - name: Specialist program activation without approval regression
        run: |
          node tests/specialistProgramLegacyActivationPostgres.test.mjs
          node --import tsx tests/therapistSpecialtyPlanPermission.test.ts

      - name: Group sessions and financial persistence regressions
        run: node scripts/group-sessions-regressions.mjs

      - name: P0-504 clinical session scope and continuation safety
        env:
          VERTO_GROUP_POSTGRES_TEST: "1"
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: group_session_ci_only
          PGDATABASE: verto_group_regression
        run: |
          node --import tsx tests/sessionSpecialtyIsolation.test.ts
          node --import tsx tests/p0504SessionContinuationPolicy.test.ts
          node --import tsx tests/p0504ContinuationPreviewRoutes.test.ts
          node tests/p0504AbaSessionAppointmentGuardPostgres.test.mjs
          node tests/p0504ShortContinuationPostgres.test.mjs

      - name: Financial plans by active professional regression
        run: |
          node --import tsx tests/patientFinancialSpecialtyClinicGate.test.ts
          node tests/p0FinancialProfessionalBindingV3.regression.test.mjs
          node tests/p0FinancialProfessionalBindingSql.test.mjs

      - name: Group session PostgreSQL concurrency
        env:
          VERTO_GROUP_POSTGRES_TEST: "1"
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: group_session_ci_only
          PGDATABASE: verto_group_regression
        run: node tests/postgresGroupSessionConcurrency.test.mjs

      - name: Expired server session and safe re-entry regression
        run: node tests/sessionExpiredCleanLogout.regression.test.mjs

      - name: Clinic authorization-denial guidance regression
        run: node tests/clinicPermissionDeniedGuidance.regression.test.mjs

      - name: Professional onboarding bearer regression
        run: node tests/professionalOnboardingAuth.regression.test.mjs

      - name: Specialist-owned therapeutic plan activation regression
        run: |
          node --import tsx tests/therapeuticSpecialistActivation.test.ts
          node --import tsx tests/specialistProgramImmediateActivation.test.ts
          node --import tsx tests/specialtyPlanRenewal.test.ts
          node tests/parallelSpecialtyPlanCycles.test.mjs

      - name: Tutorial support isolation
        run: node --import tsx tests/helpTutorialSupport.test.ts

      - name: Backend modularization batch 01 regression tests
        run: node scripts/backend-modularization-batch01-regressions.mjs

      - name: Server readiness extraction regression tests
        run: |
          node --import tsx tests/serverReadyRouteHandler.test.ts
          node tests/serverReadyRouteExtraction.regression.test.mjs

      - name: Clinic access and work schedule batch 02 regressions
        run: |
          node tests/serverRouteBatch02.regression.test.mjs
          node tests/serverRouteBatch02SourceParity.test.mjs
          node --import tsx tests/clinicRouteBatch02Handlers.test.ts

      - name: Verto pre-main regression ratchet
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -uo pipefail

          HEAD_LOG="$RUNNER_TEMP/pre-main-head.log"
          BASE_LOG="$RUNNER_TEMP/pre-main-base.log"
          NEW_LOG="$RUNNER_TEMP/pre-main-new.log"
          BASE_WORKTREE="$RUNNER_TEMP/verto-base"

          set +e
          npm run check:pre-main >"$HEAD_LOG" 2>&1
          HEAD_STATUS=$?
          set -e
          cat "$HEAD_LOG"

          if [ "$HEAD_STATUS" -eq 0 ]; then
            echo "Pre-main regression gate clean on candidate commit."
            exit 0
          fi

          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::Pre-main gate failed and no valid baseline SHA is available."
            exit "$HEAD_STATUS"
          fi

          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if [ ! -f "$BASE_WORKTREE/package.json" ]; then
            git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          fi

          pushd "$BASE_WORKTREE" >/dev/null
          if [ ! -d node_modules ]; then
            npm ci --prefer-offline --no-audit
          fi
          set +e
          npm run check:pre-main >"$BASE_LOG" 2>&1
          BASE_STATUS=$?
          set -e
          popd >/dev/null

          if [ "$BASE_STATUS" -eq 0 ]; then
            echo "::error::Baseline pre-main gate passes but candidate gate fails."
            exit "$HEAD_STATUS"
          fi

          normalize_failures() {
            grep -E '^[[:space:]]*✗[[:space:]]+' "$1" \
              | sed -E 's/^[[:space:]]*✗[[:space:]]+//' \
              | sed -E 's/[[:space:]]+—.*$//' \
              | sort -u || true
          }

          comm -23 \
            <(normalize_failures "$HEAD_LOG") \
            <(normalize_failures "$BASE_LOG") \
            > "$NEW_LOG"

          if [ -s "$NEW_LOG" ]; then
            echo "::error::New pre-main regression failures were introduced relative to staging baseline:"
            cat "$NEW_LOG"
            exit 1
          fi

          echo "::warning::Pre-main gate contains only failures already present on the staging baseline; no new regression failure was introduced."
