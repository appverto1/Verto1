name: One-time P1 push unsubscribe security patch
on:
  push:
    branches: [fix/p0-29-30-finance-p1-01-02-20261008]
    paths: [.github/workflows/p1-push-unsubscribe-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-29-30-finance-p1-01-02-20261008
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Patch one route only
        run: node scripts/p0-push-unsubscribe-scope-once.mjs
      - name: Verify and rebase commit
        run: |
          git diff --check
          test "$(git diff --name-only)" = "server.ts"
          git add server.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "fix(p1 push): scope unsubscribe to authenticated user and endpoint"
          git fetch origin fix/p0-29-30-finance-p1-01-02-20261008
          git rebase origin/fix/p0-29-30-finance-p1-01-02-20261008
          git push origin HEAD:fix/p0-29-30-finance-p1-01-02-20261008
