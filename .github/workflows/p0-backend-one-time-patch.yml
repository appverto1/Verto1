name: P0 backend one-time legacy server patch

on:
  push:
    branches:
      - fix/p0-backend-appointments-guards-20261008

permissions:
  contents: write

concurrency:
  group: verto-p0-server-patch-20261008
  cancel-in-progress: false

jobs:
  apply-small-reviewable-patch:
    if: github.ref == 'refs/heads/fix/p0-backend-appointments-guards-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0-backend-appointments-guards-20261008
          persist-credentials: true
      - name: Verify patch can be applied and generate server.ts diff
        run: node scripts/apply-p0-backend-fixes.mjs
      - name: Commit only modified legacy backend file
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- server.ts; then
            echo "Backend patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server.ts
          git diff --cached --check
          git commit -m "fix(p0): finalize backend appointment scope and confirmation"
          git push origin HEAD:fix/p0-backend-appointments-guards-20261008
