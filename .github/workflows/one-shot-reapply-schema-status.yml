name: One-shot reapply protected schema-status
on:
  push:
    branches:
      - refactor/staging-schema-status-current-20261023
permissions:
  contents: write
concurrency:
  group: verto-schema-status-reapply-20261023
  cancel-in-progress: false
jobs:
  isolated-reapply:
    if: github.ref == 'refs/heads/refactor/staging-schema-status-current-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/one-shot-reapply-schema-status.mjs
